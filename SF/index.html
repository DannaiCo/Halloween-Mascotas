<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mascotas - Halloween | 2560 x 1440</title>
  <link rel="stylesheet" href="https://use.typekit.net/vsp7vcb.css">
  <style>
    :root {
      /* ============================================================
         COMPOSICION ORIGINAL - TODAS LAS MEDIDAS EN PX
         Cambia cada left/top por separado. NO cambies el lienzo.
         ============================================================ */

      /* MARCO */
      --marco-left: 50px;
      --marco-top: 226px;
      --marco-width: 1332px;
      --marco-height: 1206px;

      /* FOTO (queda DETRAS del marco y recortada en su propia caja) */
      --foto-left: 171px;
      --foto-top: 252px;
      --foto-width: 1083px;
      --foto-height: 1166px;

      /* NOMBRE (queda ENCIMA del marco) */
      --nombre-left: 0px;
      --nombre-top: 1160px;
      --nombre-width: 1034px;
      --nombre-height: 240px;
      --nombre-borde: 15px;
    }

    * { box-sizing: border-box; }
    html {
      margin: 0px;
      padding: 0px;
      overflow: hidden;
      background: #090909;
    }

    /* El lienzo real SIEMPRE mide 2560 x 1440 px.
       JS solo transforma visualmente el lienzo completo cuando la
       ventana del reproductor tiene otro tamano. */
    body {
      position: absolute;
      left: 0px;
      top: 0px;
      margin: 0px;
      padding: 0px;
      width: 2560px;
      height: 1440px;
      overflow: hidden;
      background: #090909;
      font-family: Arial, sans-serif;
      transform-origin: 0px 0px;
    }

    .fondo-video {
      position: absolute;
      left: 0px;
      top: 0px;
      z-index: 0;
      display: block;
      width: 2560px;
      height: 1440px;
      object-fit: cover;
      object-position: center center;
      background: #090909;
    }

    .escena {
      position: absolute;
      left: 0px;
      top: 0px;
      z-index: 1;
      width: 2560px;
      height: 1440px;
      overflow: hidden;
      pointer-events: none;
      isolation: isolate;
    }

    /* CAPA 3: FOTO */
    .caja-foto {
      position: absolute;
      left: var(--foto-left);
      top: var(--foto-top);
      z-index: 1;
      width: var(--foto-width);
      height: var(--foto-height);
      overflow: hidden;
      background: transparent;
    }
    .caja-foto img {
      display: block;
      width: var(--foto-width);
      height: var(--foto-height);
      object-fit: cover;
      object-position: center center;
      opacity: 0;
      transition: opacity 250ms ease;
    }
    .caja-foto img.cargada { opacity: 1; }

    /* CAPA 2: MARCO PNG */
    .marco {
      position: absolute;
      left: var(--marco-left);
      top: var(--marco-top);
      z-index: 2;
      width: var(--marco-width);
      height: var(--marco-height);
      object-fit: fill;
      user-select: none;
    }

    /* CAPA 1: NOMBRE */
    .nombre {
      position: absolute;
      left: var(--nombre-left);
      top: var(--nombre-top);
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      width: var(--nombre-width);
      height: var(--nombre-height);
      overflow: hidden;
      text-align: center;
    }
    .nombre-texto {
      display: block;
      flex: none;
      white-space: nowrap;
      line-height: 1.08;
      font-family: "astounder-squared-bb", sans-serif;
      font-weight: 700;
      font-style: normal;
      font-size: 120px;
      color: #ffffff;
      -webkit-text-stroke: var(--nombre-borde) #260546;
      paint-order: stroke fill;
    }

    .mensaje-estado {
      position: absolute;
      right: 18px;
      bottom: 18px;
      z-index: 5;
      display: none;
      max-width: 550px;
      padding: 12px 16px;
      border-radius: 8px;
      color: #ffffff;
      background: #19131fe8;
      font: 24px/1.3 Arial, sans-serif;
    }
    .mensaje-estado.visible { display: block; }

    /* Para verificar el viewport real, abre index.html?diagnostico=1 */
    .diagnostico {
      position: absolute;
      left: 25px;
      top: 25px;
      z-index: 20;
      display: none;
      padding: 15px;
      background: #121212ed;
      color: #ffffff;
      font: 28px/1.35 monospace;
      white-space: pre-line;
      pointer-events: none;
    }
    .diagnostico.visible { display: block; }
  </style>
</head>
<body>
  <!-- Capas de abajo hacia arriba: video, foto, marco, texto. -->
  <video class="fondo-video" autoplay muted loop playsinline preload="auto" aria-hidden="true">
    <source src="fondo.mp4" type="video/mp4">
  </video>

  <main class="escena">
    <div class="caja-foto"><img id="fotoParticipante" alt=""></div>
    <img class="marco" src="Marco.png" alt="Marco Halloween">
    <div class="nombre" id="nombreParticipante">
      <span class="nombre-texto" id="nombreTexto">Cargando...</span>
    </div>
  </main>

  <div class="mensaje-estado" id="mensajeEstado" role="status"></div>
  <div class="diagnostico" id="diagnostico"></div>

  <script>
    'use strict';

    const CONFIG = {
      url: 'https://script.google.com/macros/s/AKfycbzsoirtBPjCj9eNRPbgSgxZrhmDjyCjKmRIvj6wgJ_boDdBwlw_0ih0RD98qjmOoe_u/exec',
      anchoLienzo: 2560,
      altoLienzo: 1440,
      duracionRegistroMs: 8000,
      actualizacionMs: 60000,
      tiempoEsperaMs: 15000,
      fuenteMinPx: 36,
      fuenteMaxPx: 120,
      margenNombrePx: 24,

      /* 'contener': muestra TODO el lienzo, sin recortar ni deformar.
         'cubrir': rellena la ventana, pero puede recortar los bordes.
         'estirar': llena toda la ventana, pero deforma si no es 16:9.
         Para la pantalla de 2560x1440, 'contener' usa escala 1. */
      modoAjuste: 'contener'
    };

    const cuerpo = document.body;
    const cajaNombre = document.getElementById('nombreParticipante');
    const textoNombre = document.getElementById('nombreTexto');
    const foto = document.getElementById('fotoParticipante');
    const mensajeEstado = document.getElementById('mensajeEstado');
    const diagnostico = document.getElementById('diagnostico');

    let registros = [];
    let pendientes = [];
    let registroActual = null;
    let nombreCompleto = '';
    let contadorPeticion = 0;
    let alertaTimer;
    let yaInicio = false;

    const idDe = r => r.nombre + '\u0000' + r.urlImagen;

    function ajustarPantalla() {
      const viewportAncho = window.innerWidth;
      const viewportAlto = window.innerHeight;
      const escalaX = viewportAncho / CONFIG.anchoLienzo;
      const escalaY = viewportAlto / CONFIG.altoLienzo;
      const modo = CONFIG.modoAjuste;
      const esc = modo === 'cubrir' ? Math.max(escalaX, escalaY) : Math.min(escalaX, escalaY);
      const sx = modo === 'estirar' ? escalaX : esc;
      const sy = modo === 'estirar' ? escalaY : esc;
      const offsetX = (viewportAncho - CONFIG.anchoLienzo * sx) / 2;
      const offsetY = (viewportAlto - CONFIG.altoLienzo * sy) / 2;

      cuerpo.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${sx}, ${sy})`;

      if (new URLSearchParams(window.location.search).get('diagnostico') === '1') {
        diagnostico.classList.add('visible');
        diagnostico.textContent = 'VENTANA: ' + viewportAncho + ' x ' + viewportAlto + ' px\n' +
          'LIENZO: 2560 x 1440 px\n' +
          'AJUSTE: ' + modo + '\n' +
          'ESCALA: ' + sx.toFixed(4) + ' x ' + sy.toFixed(4);
      }
    }

    function notificar(texto) {
      mensajeEstado.textContent = texto;
      mensajeEstado.classList.add('visible');
      clearTimeout(alertaTimer);
      alertaTimer = setTimeout(() => mensajeEstado.classList.remove('visible'), 7500);
    }

    /* El Apps Script debe estar publicado con el doGet JSONP
       (la version Code.gs adjunta en el proyecto original). */
    function consultarAppsScript() {
      return new Promise((resolve, reject) => {
        const callback = '_participantesCallback_' + Date.now() + '_' + (++contadorPeticion);
        const script = document.createElement('script');
        let terminado = false;
        let temporizador;
        function finalizar(error, datos) {
          if (terminado) return;
          terminado = true;
          clearTimeout(temporizador);
          script.remove();
          delete window[callback];
          if (error) reject(error);
          else resolve(datos);
        }
        window[callback] = datos => finalizar(null, datos);
        script.onerror = () => finalizar(new Error('No se pudo conectar con Apps Script.'));
        temporizador = setTimeout(
          () => finalizar(new Error('La consulta a Apps Script agotó el tiempo de espera.')),
          CONFIG.tiempoEsperaMs
        );
        const separador = CONFIG.url.includes('?') ? '&' : '?';
        script.src = CONFIG.url + separador + 'callback=' + encodeURIComponent(callback) + '&_=' + Date.now();
        document.head.appendChild(script);
      });
    }

    function obtenerUrlImagen(valor) {
      const texto = String(valor ?? '').trim();
      if (!texto) return '';
      let url;
      try { url = new URL(texto); }
      catch { return ''; }
      if (!['https:', 'http:'].includes(url.protocol)) return '';
      if (url.hostname === 'drive.google.com') {
        const match = url.pathname.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
        const id = match ? match[1] : url.searchParams.get('id');
        if (id) return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w1600';
      }
      return url.href;
    }

    function ajustarNombre() {
      if (!nombreCompleto) return;
      textoNombre.textContent = nombreCompleto;
      cajaNombre.title = nombreCompleto;
      const anchoMax = cajaNombre.clientWidth - 2 * CONFIG.margenNombrePx;
      const altoMax = cajaNombre.clientHeight - 2 * CONFIG.margenNombrePx;
      const cabe = () => {
        /* getBoundingClientRect se transforma con el body; se compara en
           coordenadas locales usando scrollWidth / scrollHeight. */
        return textoNombre.scrollWidth <= anchoMax && textoNombre.scrollHeight <= altoMax;
      };
      let min = CONFIG.fuenteMinPx;
      let max = CONFIG.fuenteMaxPx;
      let tam = min;
      while (min <= max) {
        const medio = Math.floor((min + max) / 2);
        textoNombre.style.fontSize = medio + 'px';
        if (cabe()) { tam = medio; min = medio + 1; }
        else max = medio - 1;
      }
      textoNombre.style.fontSize = tam + 'px';
      if (!cabe()) {
        const letras = [...nombreCompleto];
        let a = 0, b = letras.length, mejor = '…';
        while (a <= b) {
          const m = Math.floor((a + b) / 2);
          const candidato = letras.slice(0, m).join('').trimEnd() + '…';
          textoNombre.textContent = candidato;
          if (cabe()) { mejor = candidato; a = m + 1; }
          else b = m - 1;
        }
        textoNombre.textContent = mejor;
      }
    }

    function mezclarCopia(lista) {
      const mezcla = [...lista];
      for (let i = mezcla.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [mezcla[i], mezcla[j]] = [mezcla[j], mezcla[i]];
      }
      /* Evita mostrar el mismo participante entre el fin de una ronda
         y el comienzo de la siguiente cuando hay al menos dos. */
      if (mezcla.length > 1 && registroActual && idDe(mezcla[0]) === idDe(registroActual)) {
        [mezcla[0], mezcla[1]] = [mezcla[1], mezcla[0]];
      }
      return mezcla;
    }

    function mostrarRegistro(registro) {
      registroActual = registro;
      nombreCompleto = registro.nombre;
      ajustarNombre();
      foto.classList.remove('cargada');
      foto.alt = 'Foto de ' + registro.nombre;
      foto.onload = () => foto.classList.add('cargada');
      foto.onerror = () => notificar('No se pudo cargar la foto. Revisa sus permisos y la URL.');
      foto.src = registro.urlImagen;
    }

    function siguienteRegistro() {
      if (!registros.length) return;
      if (!pendientes.length) pendientes = mezclarCopia(registros);
      mostrarRegistro(pendientes.shift());
    }

    async function actualizarRegistros() {
      try {
        const datos = await consultarAppsScript();
        if (!Array.isArray(datos)) throw new Error('Apps Script no devolvió una lista.');
        const nuevos = datos.map(item => ({
          nombre: String(item?.nombre ?? '').trim(),
          urlImagen: obtenerUrlImagen(item?.imagen)
        })).filter(item => item.nombre && item.urlImagen);
        const idsNuevos = new Set(nuevos.map(idDe));
        const idsAnteriores = new Set(registros.map(idDe));
        registros = nuevos;
        /* Elimina los rechazados o eliminados sin reiniciar la ronda. */
        pendientes = pendientes.filter(item => idsNuevos.has(idDe(item)));
        /* Las aprobaciones nuevas entran en la ronda en curso. */
        const agregados = nuevos.filter(item => !idsAnteriores.has(idDe(item)) &&
          (!registroActual || idDe(item) !== idDe(registroActual)));
        if (yaInicio && agregados.length) pendientes.push(...mezclarCopia(agregados));

        if (!registros.length) {
          registroActual = null;
          pendientes = [];
          nombreCompleto = 'No hay registros aprobados';
          ajustarNombre();
          foto.classList.remove('cargada');
          foto.removeAttribute('src');
          return;
        }
        if (!yaInicio || !registroActual || !idsNuevos.has(idDe(registroActual))) {
          yaInicio = true;
          if (!pendientes.length) pendientes = mezclarCopia(registros);
          mostrarRegistro(pendientes.shift());
        }
      } catch (error) {
        console.error('Error:', error);
        notificar('No se pudieron actualizar los datos. Verifica la publicación de Apps Script.');
        if (!registros.length) {
          nombreCompleto = 'Sin conexión';
          ajustarNombre();
        }
      }
    }

    ajustarPantalla();
    window.addEventListener('resize', ajustarPantalla);
    document.fonts?.ready.then(ajustarNombre).catch(() => {});
    actualizarRegistros();
    setInterval(siguienteRegistro, CONFIG.duracionRegistroMs);
    setInterval(actualizarRegistros, CONFIG.actualizacionMs);
  </script>
</body>
</html>
