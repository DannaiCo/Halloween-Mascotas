<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />

        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <title>Halloween</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,800;1,800&display=swap"
            rel="stylesheet" />

        <style>
            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                padding: 40px;
                min-height: 100vh;
                background: #012aff;
                color: #ffffff;
                font-family: "Open Sans", sans-serif;
            }

            main {
                width: min(100%, 900px);
                margin: 0 auto;
            }

            h1 {
                margin: 0 0 10px;
                font-size: 45px;
            }

            p {
                margin: 0 0 32px;
                color: #ffffff;
                font-size: 22px;
            }

            .screens {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                gap: 16px;
            }

            .screen {
                display: block;
                padding: 22px;
                border: 1px solid #293142;
                border-radius: 14px;
                background: #002356;
                color: #ffffff;
                text-align: center;
                text-decoration: none;
                transition:
                    transform 150ms ease,
                    border-color 150ms ease;
            }

            .screen:hover {
                transform: translateY(-10px);
                border-color: #dae505;
                border-width: 5px;
            }

            .screen strong {
                display: block;
                margin-bottom: 8px;
                color: #efefef;
                font-size: 25px;
            }

            .screen span {
                color: #efefef;
                font-size: 16px;
            }
        </style>
    </head>

    <body>
        <main>
            <h1>Mascotas - Halloween</h1>

            <p>Selecciona una pantalla para abrir su contenido.</p>

            <div class="screens">
                <a class="screen" href="./SF/">
                    <strong>Santa Fe</strong>
                    <span>2560 × 1440</span>
                </a>

                <a class="screen" href="./JPC/">
                    <strong>Jardin Plaza Cuadrada</strong>
                    <span>769 × 769</span>
                </a>
            </div>
        </main>
    </body>
</html>
